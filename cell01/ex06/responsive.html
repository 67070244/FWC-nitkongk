<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            border: 1px solid black;
            padding: 20px;
        }

        .first {
            background-color: lightgreen;
        }

        .second {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
